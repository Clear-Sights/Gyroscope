<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Gyroscope</title>
  <desc id="desc">Gyroscope — do not let the session derail irreversibly</desc>
  <style>
    .background { fill: #f6f8fa; }
    .border { fill: none; stroke: #d0d7de; }
    .grid { stroke: #d8dee4; }
    .rotor { stroke: #1a7f37; }
    .gimbal { stroke: #59636e; }
    .axis { fill: #1a7f37; }
    .name { fill: #1f2328; }
    .purpose { fill: #59636e; }
    .rule { stroke: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .border { stroke: #30363d; }
      .grid { stroke: #21262d; }
      .rotor { stroke: #3fb950; }
      .gimbal { stroke: #b1bac4; }
      .axis { fill: #3fb950; }
      .name { fill: #f0f6fc; }
      .purpose { fill: #b1bac4; }
      .rule { stroke: #3fb950; }
    }
  </style>

  <rect class="background" x="1" y="1" width="1198" height="208" rx="18"/>
  <rect class="border" x="1" y="1" width="1198" height="208" rx="18"/>

  <g class="grid" opacity="0.62" stroke-width="1">
    <path d="M24 36H1176 M24 174H1176"/>
    <path d="M214 18V192 M1080 18V192"/>
  </g>

  <g transform="translate(111 105)" fill="none" stroke-linecap="round">
    <circle class="gimbal" r="66" stroke-width="3"/>
    <ellipse class="gimbal" rx="66" ry="24" stroke-width="2" opacity="0.7"/>
    <ellipse class="rotor" rx="42" ry="42" stroke-width="5"/>
    <ellipse class="rotor" rx="42" ry="14" stroke-width="3" opacity="0.8"/>
    <line class="gimbal" x1="0" y1="-80" x2="0" y2="-58" stroke-width="4"/>
    <line class="gimbal" x1="0" y1="58" x2="0" y2="80" stroke-width="4"/>
    <circle class="axis" r="7" stroke="none"/>
  </g>

  <line class="rule" x1="240" y1="62" x2="305" y2="62" stroke-width="5" stroke-linecap="round"/>
  <text class="name" x="238" y="125" font-family="system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="6">GYROSCOPE</text>
  <text class="purpose" x="243" y="166" font-family="system-ui, sans-serif" font-size="27" font-weight="500" letter-spacing="0.5">do not let the session derail irreversibly</text>

  <g transform="translate(1010 74)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle class="border" cx="35" cy="31" r="30" stroke-width="2"/>
    <path class="rule" d="M35 13V31L48 40" stroke-width="5"/>
  </g>
